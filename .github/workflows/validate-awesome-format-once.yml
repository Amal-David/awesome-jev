name: Validate Awesome readiness once

on:
  push:
    branches: ['validation/awesome-format-20260925']
    paths: ['.github/workflows/validate-awesome-format-once.yml']

permissions:
  contents: read

jobs:
  repository-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8248957986b834c6c879ba0e2792fa2202550bbc
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed documentation tree offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8248957986b834c6c879ba0e2792fa2202550bbc
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          docker pull python@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,source=$PWD,target=/work" --workdir /work \
            --mount "type=bind,source=$scratch,target=/scratch" \
            --env HOME=/tmp --env TMPDIR=/scratch --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_NOSYSTEM=1 --env GIT_CONFIG_GLOBAL=/dev/null \
            python@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0 bash -se <<'BASH'
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          base = '307be50fe9a0898927a6b02ccc410845c60796e2'
          for key in ('GITHUB_TOKEN', 'GH_TOKEN', 'TYPESAFE_API_KEY', 'OPENAI_API_KEY', 'ANTHROPIC_API_KEY'):
              assert not os.environ.get(key), 'Unexpected credential in test environment'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          expected = {'.github/PULL_REQUEST_TEMPLATE.md', 'docs/AWESOME_SUBMISSION.md', 'docs/GROWTH.md'}
          assert changed == expected, changed
          for name in ('README.md', 'docs/DIRECTORY.md', 'LICENSE', 'LICENSE-CODE', 'data/curated.json', 'data/exclusions.json', 'data/x_demos.json', 'data/media.json', 'data/media_cache.json', 'data/catalog.json', 'data/discoveries.json', 'data/refresh.json', '.github/workflows/curate.yml', '.github/workflows/test.yml'):
              assert Path(name).read_bytes() == subprocess.check_output(['git', 'show', base + ':' + name]), name
          assert not Path('.github/README.md').exists()
          text = Path('.github/PULL_REQUEST_TEMPLATE.md').read_text(encoding='utf-8')
          assert 'Both READMEs must match' not in text
          assert 'root `README.md` directly' in text
          assert 'git diff --check' in text
          print('Only three reviewed Markdown files changed; selections, gallery, licenses, workflows, and source data preserved.')
          PY
          python3 scripts/build.py
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py --check
          git diff --check
          git diff --check 307be50fe9a0898927a6b02ccc410845c60796e2
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'VALIDATED: exact reviewed tree, offline build/tests/check, whitespace, clean regeneration.'
          BASH
  awesome-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8248957986b834c6c879ba0e2792fa2202550bbc
          fetch-depth: 0
          persist-credentials: false
      - name: Run complete upstream lint with no credentials or lifecycle hooks
        shell: bash
        run: |
          set -euo pipefail
          tools=$(mktemp -d)
          trap 'rm -rf -- "$tools"' EXIT
          docker pull node@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$tools,target=/tools" --workdir /work \
            --env HOME=/tmp --env GIT_CONFIG_NOSYSTEM=1 --env GIT_CONFIG_GLOBAL=/dev/null \
            node@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7 bash -se -c '
              set -euo pipefail
              node --version
              npm install --prefix /tools --ignore-scripts --no-audit --no-fund awesome-lint@2.3.0
              node /tools/node_modules/awesome-lint/cli.js README.md
            '
