name: Validate PR 12 exact merge

on:
  push:
    branches:
      - automation/pr12-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Checkout exact reviewed merge
        run: |
          git fetch origin refs/pull/12/merge
          test "$(git rev-parse FETCH_HEAD)" = "df1a0e410773ab396e5e85c942cf60d2efa710c7"
          git checkout --detach FETCH_HEAD
      - name: Build generated views
        run: python3 scripts/build.py
      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Check generated views
        run: python3 scripts/build.py --check
      - name: Check diff whitespace
        run: git diff --check
      - name: Require clean generated tree
        run: git diff --exit-code
