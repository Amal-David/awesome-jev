name: Curation validation

on:
  push:
    branches:
      - automation/curation-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build generated views
        run: python3 scripts/build.py
      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Check generated views
        run: python3 scripts/build.py --check
      - name: Check diff whitespace
        run: git diff --check
