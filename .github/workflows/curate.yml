name: Refresh Jev directory

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/curated.json'
      - 'examples/**'

permissions:
  contents: read

concurrency:
  group: awesome-jev-curation
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Discover, verify metadata, and render
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/curate.py --refresh
      - name: Validate generated catalog
        run: python3 scripts/curate.py --check
      - name: Commit meaningful directory changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/catalog.json docs/CATALOG.md data/discoveries.json
          if git diff --cached --quiet; then
            echo 'No directory changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'chore: refresh Jev directory and source metadata'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "Published directory update: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
